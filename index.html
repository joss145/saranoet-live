
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101310">
  <meta name="description" content="Mira SaraNoet en vivo en Kick y Twitch.">
  <title>SaraNoet Live</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e0c;
      --panel: #141916;
      --line: #29332d;
      --muted: #9aa69e;
      --green: #53fc18;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #172219 0, #0b0e0c 48rem);
      color: #f5f7f5;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrap {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 28px 22px 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--green);
      color: #071006;
      font-weight: 950;
      font-size: 19px;
      box-shadow: 0 0 28px #53fc1830;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 32px);
      letter-spacing: .04em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .live-pill {
      border: 1px solid #31512b;
      color: #a9ff91;
      background: #132010;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .column {
      min-width: 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 10px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: .12em;
    }

    .platform {
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
    }

    .card {
      overflow: hidden;
      background: linear-gradient(180deg, #171e19, #111612);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 36px #0005;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      border: 0;
      background: #050706;
    }

    .chat-card {
      margin-top: 14px;
    }

    .chat-title {
      padding: 13px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 750;
    }

    .chat-title span:last-child {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .chat-frame {
      display: block;
      width: 100%;
      height: 470px;
      border: 0;
      background: #101411;
    }

    .odysee-placeholder {
      aspect-ratio: 16 / 9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      background: radial-gradient(circle at 50% 40%, #2b2417, #101411 70%);
    }

    .odysee-logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -.06em;
      color: #f7a928;
    }

    .odysee-placeholder p {
      max-width: 340px;
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
    }

    .channel-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 15px;
      border: 1px solid #735222;
      border-radius: 9px;
      color: #ffd18a;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    footer {
      margin-top: 26px;
      text-align: center;
      color: #77837a;
      font-size: 12px;
    }

    /* ORDEN PARA TELEFONOS */

    @media (max-width: 800px) {

      .wrap {
        padding: 20px 14px 36px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      /* TWITCH PRIMERO */
      .column:nth-child(2) {
        order: 1;
      }

      /* KICK DESPUES */
      .column:nth-child(1) {
        order: 2;
        display: flex;
        flex-direction: column;
      }

      /* TWITCH: STREAM Y CHAT JUNTOS ARRIBA */
      .column:nth-child(2) {
        display: flex;
        flex-direction: column;
      }

      /* KICK DEBAJO DE TWITCH */
      .column:nth-child(1) {
        display: flex;
        flex-direction: column;
      }

      .chat-frame {
        height: 420px;
      }

      header {
        align-items: flex-start;
      }

      .live-pill {
        white-space: nowrap;
      }
    }

    @media (max-width: 420px) {

      .mark {
        width: 36px;
        height: 36px;
      }

      .subtitle {
        font-size: 12px;
      }

      .chat-frame {
        height: 380px;
      }
    }

  

    .unified-chat {
      margin-top: 24px;
    }

    .unified-chat .chat-title {
      font-size: 15px;
    }

    .unified-messages {
      height: 360px;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: #0e120f;
    }

    .unified-message {
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.45;
    }

    .unified-message .platform-tag {
      display: inline-block;
      margin-right: 7px;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .06em;
    }

    .unified-message .platform-tag.kick { color: #53fc18; }
    .unified-message .platform-tag.twitch { color: #b79aff; }
    .unified-message .username { font-weight: 800; margin-right: 6px; }
    .unified-message .time { color: #77837a; font-size: 10px; margin-left: 7px; }
    .unified-status { color: var(--muted); font-size: 11px; padding: 10px 14px; border-top: 1px solid var(--line); }

  </style>
</head>

<body>

  <main class="wrap">

    <header>
      <div class="brand">
        <div class="mark">S</div>
        <div>
          <h1>SARANOET LIVE</h1>
          <p class="subtitle">Dos comunidades, un mismo directo</p>
        </div>
      </div>

      <div class="live-pill">● TRANSMISIONES</div>
    </header>

    <section class="grid" aria-label="Reproductores en vivo">

      <!-- COLUMNA KICK -->
      <div class="column">

        <div class="section-head">
          <h2>KICK</h2>
          <span class="platform">SARANOET</span>
        </div>

        <div class="card">
          <iframe
            class="player"
            src="https://player.kick.com/saranoet?muted=false"
            title="Reproductor de Kick de SaraNoet"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            loading="lazy">
          </iframe>
        </div>

        <!-- CHAT KICK -->
        <section class="card chat-card" aria-label="Chat de Kick">
          <div class="chat-title">
            <span>CHAT DE KICK</span>
            <span>SaraNoet</span>
          </div>
          <iframe
            class="chat-frame"
            src="https://chat.kick.cx/embed/saranoet"
            title="Chat de Kick de SaraNoet"
            loading="lazy">
          </iframe>
        </section>

      </div>

      <!-- COLUMNA TWITCH -->
      <div class="column">

        <div class="section-head">
          <h2>TWITCH</h2>
          <span class="platform">SARANOET</span>
        </div>

        <div class="card">
          <iframe
            class="player"
            src="https://player.twitch.tv/?channel=sarainoet&parent=live.saranoet.stream&muted=true"
            title="Reproductor de Twitch de SaraNoet"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            loading="lazy">
          </iframe>
        </div>


        <!-- CHAT TWITCH -->
        <section class="card chat-card" aria-label="Chat de Twitch">

          <div class="chat-title">
            <span>CHAT DE TWITCH</span>
            <span>SaraNoet</span>
          </div>

          <iframe
            class="chat-frame"
            src="https://www.twitch.tv/embed/sarainoet/chat?parent=live.saranoet.stream&darkpopout"
            title="Chat de Twitch de SaraNoet"
            loading="lazy"
            allow="clipboard-write">
          </iframe>

        </section>
      </div>

    </section>



    <!-- CHAT UNIFICADO: MENSAJES RECIBIDOS DE TWITCH Y KICK -->
    <section class="card unified-chat" aria-label="Chat unificado de Twitch y Kick">
      <div class="chat-title">
        <span>CHAT UNIFICADO</span>
        <span>TWITCH + KICK</span>
      </div>
      <div id="unified-messages" class="unified-messages" aria-live="polite">
        <div class="unified-message">Cargando mensajes...</div>
      </div>
      <div id="unified-status" class="unified-status">Actualizando automáticamente</div>
    </section>

    <footer>
      SaraNoet Live · Alojado en Vercel
    </footer>

  </main>



  <script>
    (() => {
      const list = document.getElementById("unified-messages");
      const status = document.getElementById("unified-status");
      let newestSignature = "";

      function addMessage(message) {
        const row = document.createElement("div");
        row.className = "unified-message";

        const platform = document.createElement("span");
        platform.className = "platform-tag " + (message.platform === "twitch" ? "twitch" : "kick");
        platform.textContent = message.platform === "twitch" ? "TWITCH" : "KICK";

        const username = document.createElement("span");
        username.className = "username";
        username.textContent = message.username || "Usuario";

        const content = document.createElement("span");
        content.textContent = message.content || "";

        const time = document.createElement("span");
        time.className = "time";
        const date = new Date(message.sent_at);
        time.textContent = Number.isNaN(date.getTime()) ? "" : date.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });

        row.append(platform, username, content, time);
        return row;
      }

      async function loadMessages() {
        try {
          const response = await fetch("/api/chat/messages", { cache: "no-store" });
          if (!response.ok) throw new Error("HTTP " + response.status);
          const result = await response.json();
          const messages = Array.isArray(result.messages) ? result.messages : [];
          const signature = messages.map(m => m.id).join("|");
          if (signature !== newestSignature) {
            const wasNearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
            list.replaceChildren();
            messages.forEach(message => list.appendChild(addMessage(message)));
            if (wasNearBottom) list.scrollTop = list.scrollHeight;
            newestSignature = signature;
          }
          if (!messages.length) {
            list.textContent = "Todavía no hay mensajes. ¡Escribe en Twitch o Kick!";
          }
          status.textContent = "Conectado · " + messages.length + " mensajes recientes";
        } catch (error) {
          status.textContent = "No se pudieron cargar los mensajes. Reintentando...";
        }
      }

      loadMessages();
      setInterval(loadMessages, 5000);
    })();
  </script>

</body>
</html>
